(function () {
  var parts = decodeURIComponent(location.hash.slice(1)).split("/"), ex = FretExercises.byId(parts[0]);
  if (ex && FretExercises.ENGINES[ex.engine].ready) location.replace(FretExercises.pageFor(ex) + (parts[1] ? "/" + encodeURIComponent(parts.slice(1).join("/")) : ""));
  else location.replace("index.html");
})();
</script>
